name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    # Keep the OS compatible with the pinned Playwright browsers.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source and package
        run: npm run check

      - name: Run Chromium E2E
        run: npm run test:e2e

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  minimum-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up tooling Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vitest 4 needs Node 20+. Unit tests run in release-check on Node 22;
      # the library build and consumer package must still work on Node 18.
      - name: Set up minimum Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.20.8

      - name: Verify minimum Node.js build and package support
        run: npm run check:package
