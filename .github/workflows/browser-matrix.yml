name: Browser Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'gyosjs/gyosjs'
    runs-on: ubuntu-24.04
    # Match @playwright/test; includes all three browsers and OS dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --user 1001 --init --ipc=host
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e:all
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-matrix-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
