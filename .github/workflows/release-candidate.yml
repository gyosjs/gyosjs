name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected package version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'gyosjs/gyosjs'
    runs-on: ubuntu-24.04
    # Match @playwright/test; avoid fetching OS dependencies from apt at runtime.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --init --ipc=host
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify requested version
        run: npm run version:check -- "${{ inputs.version }}"
      - name: Verify release candidate
        run: npm run release:check
      - name: Create verified npm artifact
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: gyosjs-${{ inputs.version }}
          path: release-artifacts/gyosjs-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7
